<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title> Atualizar Editorial </title>
		<link href="../styles/header.css" rel="stylesheet">
		<link href="../styles/lista.css" rel="stylesheet">
		<link href="../styles/vim.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	</head>
	<body>
		<div id="header"> </div>

		<div class="auth">
			<div id="titulo"> Adicionar Editorial </div>
			<form onsubmit='cadastrar_editorial(); return false;'>
				<div class='coluna'>
					<div class='linha'>
						<span> Problema: </span>
						<input type='text' id='problema_search' placeholder='Procure o problema'>
					</div>
					<div class='search_selected' id='problema_selecionado'> </div>
					<div class='search_container' id='problemas'> </div>
				</div>
				<div class='coluna' id='editorial'>
						<div class='coluna editor_preview'id='editorial_container'>
							<div id='editor'> </div>
							<div id='preview' class='escondido'> </div>
						</div>
					
				</div>
				<button id='editorial_cadastro'> Cadastrar </button>
			</form>
			<div id='editorial_response'></div>
		</div>

		<script src="./../src/session.js" type="text/javascript"></script>
		<script src="./../src/header.js" type="text/javascript"></script>
		<script src="./../src/admin_editoriais.js" type="text/javascript"></script>
		<script src="./../src/vim.js" type="text/javascript"></script>
		<script src="./../src/fundo.js" type="text/javascript"></script>
	</body>
</html>
