<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title> Sign Up </title>
		<link href="../styles/header.css" rel="stylesheet">
		<link href="../styles/lista.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	</head>
	<body>
		<div id="header"> </div>
		<div id="titulo"> Sign Up </div>

		<div class="auth">
			<form id='auth_cadastro'>
				<div class='linha'>
					<span> Username: </span>
					<input type='text' id='cadastro_name' placeholder='username' required>
				</div>
				<div class='linha'>
					<span> Email: </span>
					<input type='email' id='cadastro_email' placeholder='email' required>
				</div>
				<div class='linha'>
					<span> Password: </span>
					<input type='password' id='cadastro_senha' placeholder='senha' required>
				</div>
				<button type='button' id='cadastro_button' onclick='cadastro()'> Sign Up </button>
			</form>
			<div id='response'></div>
			
		</div>

		<script src="./../src/session.js" type="text/javascript"></script>
		<script src="./../src/header.js" type="text/javascript"></script>
		<script src="./../src/cadastro.js" type="text/javascript"></script>
		<script src="./../src/fundo.js" type="text/javascript"></script>
	</body>
</html>
